<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Components</title>

    <!--Link Favicon-->
    <link rel="shortcut icon" href="../img/logoOMAfondoBlanco.svg" type="image/x-icon">

    <!-- TU CSS REAL -->
    <link rel="stylesheet" href="../CSS/estilos.css" />

    <!--Link Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

    <!--Link Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;1,100&display=swap"
        rel="stylesheet">

    <style>
        /* UI del catálogo – aislada con ds- */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f4f5f7;
        }

        .ds-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, .1);
            padding: 12px 16px;
        }

        .ds-topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }

        .ds-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .ds-title {
            font-weight: 800;
            margin: 0;
            font-size: 18px;
        }

        .ds-controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        .ds-input,
        .ds-select,
        .ds-textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, .2);
            font-size: 14px;
        }

        .ds-btn {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, .2);
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .ds-btn.primary {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .ds-wrap {
            background-color: black;
            max-width: 100%;
            margin: 0 auto;
        }

        .ds-grid {
            padding: 30px 0;
            display: grid;
            gap: 30px;
        }

        .ds-card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, .1);
            overflow: hidden;
        }

        .ds-cardhead {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(0, 0, 0, .08);
        }

        .ds-cardhead {
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            background: #dddddd;
        }

        .ds-cardtitle {
            margin: 0;
            font-weight: 800;
        }

        .ds-preview {
            padding: 0;
            background: #f0f2f5;
        }

        .ds-previewframe {
            border: 1px dashed rgba(0, 0, 0, .2);
            border-radius: 10px;
            background: #fff;
        }

        .ds-codewrap {
            padding: 14px;
            border-top: 1px solid rgba(0, 0, 0, .08);
            background: #dddddd;
        }

        pre {
            margin: 0;
            padding: 12px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, .15);
            font-size: 12px;
            overflow: auto;
        }

        .ds-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            justify-content: space-between;
            /* izquierda toggle, derecha copiar */
            align-items: center;
        }

        /* Panel agregar */
        .ds-panel {
            display: none;
            margin-bottom: 20px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, .1);
            padding: 14px;
        }

        .ds-panel.show {
            display: block;
        }

        .ds-form {
            display: grid;
            gap: 10px;
        }

        .ds-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .ds-textarea {
            min-height: 160px;
            font-family: monospace;
        }

        .ds-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity .2s;
        }

        .ds-toast.show {
            opacity: 1;
        }

        /* ====== Details (código desplegable) ====== */
        .ds-details {
            max-width: 100%;
        }

        .ds-summary {
            cursor: pointer;
            user-select: none;
            list-style: none;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            display: inline-block;
        }

        .ds-summary::-webkit-details-marker {
            display: none;
        }

        .ds-details[open] .ds-summary {
            background: rgba(255, 255, 255, .12);
        }

        .ds-pre {
            margin-top: 10px;
        }

        @media (max-width: 900px) {
            .ds-controls {
                grid-template-columns: 1fr;
            }

            .ds-split {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="ds-topbar">
        <div class="ds-topbar-inner">
            <div class="ds-row">
                <h1 class="ds-title">Components</h1>
                <button id="toggleAdd" class="ds-btn primary">+ Agregar componente</button>
            </div>

            <div class="ds-controls">
                <input id="searchInput" class="ds-input" placeholder="Buscar componentes…" />
                <select id="categoryFilter" class="ds-select">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="statusFilter" class="ds-select">
                    <option value="active">Activos</option>
                    <option value="all">Todos</option>
                </select>
                <button id="reloadBtn" class="ds-btn">Recargar</button>
            </div>
        </div>
    </header>


    <!-- -------------------------------------------------------------- -->
    <!-- ESTE CODIGO NO SE EDITA, ES UNA VISUALIZACION PARA MAURI Y PAU -->
    <!-- -------------------------------------------------------------- -->
    <!-- -------------------------------------------------------------- -->
    <!-- ESTE CODIGO NO SE EDITA, ES UNA VISUALIZACION PARA MAURI Y PAU -->
    <!-- -------------------------------------------------------------- -->
    <!-- -------------------------------------------------------------- -->
    <!-- ESTE CODIGO NO SE EDITA, ES UNA VISUALIZACION PARA MAURI Y PAU -->
    <!-- -------------------------------------------------------------- -->

    <main class="ds-wrap">

        <!-- PANEL AGREGAR -->
        <section id="addPanel" class="ds-panel">
            <div class="ds-form">
                <input id="categoryInput" class="ds-input" placeholder="Categoría (ej: Textos)" />
                <input id="nameInput" class="ds-input" placeholder="Nombre del componente" />
                <input id="idInput" class="ds-input" placeholder="ID (opcional, se genera solo)" />

                <textarea id="htmlInput" class="ds-textarea" placeholder="Pegá acá el HTML"></textarea>

                <div class="ds-split">
                    <div>
                        <strong>Preview</strong>
                        <div id="preview" class="ds-previewframe"></div>
                    </div>
                    <div>
                        <strong>Código</strong>
                        <pre id="code"><code></code></pre>
                        <div class="ds-actions">
                            <button id="copyBtn" class="ds-btn">Copiar</button>
                            <button id="saveBtn" class="ds-btn primary">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- LISTADO -->
        <div id="grid" class="ds-grid"></div>

    </main>

    <div id="toast" class="ds-toast">OK</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyAagZ2YodYXoiXLA34EhYl7KutIHHSYH8SCicJL-Khj5tDbMjcU83STNnUIo5KSku8/exec";

        const $ = id => document.getElementById(id);
        const toast = msg => {
            $("toast").textContent = msg;
            $("toast").classList.add("show");
            setTimeout(() => $("toast").classList.remove("show"), 900);
        };

        function escapeHtml(s) {
            return s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
        }

        function sanitize(html) {
            return html.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "");
        }

        function slug(s) {
            return s.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
        }

        let searchTimer = null;

        // Guardamos todas las categorías detectadas (de un fetch "all")
        let allCategories = [];

        // Evita que respuestas viejas pisen las nuevas
        let lastRequestId = 0;

        function setCategoryOptions(categories, keepSelectedValue = true) {
            const select = $("categoryFilter");
            const current = keepSelectedValue ? select.value : "";

            select.innerHTML = `<option value="">Todas las categorías</option>` +
                categories.map(c => `<option value="${c}">${c}</option>`).join("");

            // restaura selección si todavía existe
            if (keepSelectedValue) {
                select.value = current;
                // si la selección ya no existe (por ejemplo quedó vieja), vuelve a todas
                if (select.value !== current) select.value = "";
            }
        }

        async function refreshCategories() {
            // Pedimos TODOS para armar el listado de categorías una sola vez
            const url = new URL(API_URL);
            url.searchParams.set("status", "all"); // traemos todo para extraer categorías

            const res = await fetch(url);
            const data = await res.json();

            if (!data.ok) return;

            allCategories = [...new Set((data.items || []).map(i => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
            setCategoryOptions(allCategories, true);
        }


        /* PANEL */
        $("toggleAdd").onclick = () => $("addPanel").classList.toggle("show");

        $("htmlInput").oninput = () => {
            const raw = $("htmlInput").value;
            $("preview").innerHTML = sanitize(raw);
            $("code").innerHTML = `<code>${escapeHtml(raw)}</code>`;
        };

        $("copyBtn").onclick = () => {
            navigator.clipboard.writeText($("htmlInput").value);
            toast("Copiado");
        };

        $("saveBtn").onclick = async () => {
            const category = $("categoryInput").value.trim();
            const name = $("nameInput").value.trim();
            const html = $("htmlInput").value.trim();
            let id = $("idInput").value.trim();

            if (!category || !name || !html) {
                toast("Completá categoría, nombre y HTML");
                return;
            }

            if (!id) id = slug(name);

            const payload = {
                action: "upsert",
                item: { id, category, name, html, status: "active" }
            };

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.ok) {
                toast("Guardado");
                $("nameInput").value = "";
                $("idInput").value = "";
                $("htmlInput").value = "";
                $("preview").innerHTML = "";
                $("code").innerHTML = "<code></code>";

                await refreshCategories();
                await loadComponents();
            }
            else {
                toast("Error al guardar");
            }
        };

        /* LISTADO */
        async function loadComponents() {
            const requestId = ++lastRequestId;

            const url = new URL(API_URL);
            url.searchParams.set("status", $("statusFilter").value);

            const cat = $("categoryFilter").value;
            const q = $("searchInput").value.trim();

            if (cat) url.searchParams.set("category", cat);
            if (q) url.searchParams.set("search", q);

            const res = await fetch(url);
            const data = await res.json();

            // Si mientras tanto disparaste otra búsqueda, ignoramos esta respuesta vieja
            if (requestId !== lastRequestId) return;

            const grid = $("grid");
            grid.innerHTML = "";

            if (!data.ok || !data.items.length) {
                grid.innerHTML = "<p style='padding:12px'>No hay componentes</p>";
                return;
            }

            data.items.forEach(it => {
                const card = document.createElement("div");
                card.className = "ds-card";
                card.innerHTML = `
                    <div class="ds-cardhead"><strong>${it.name}</strong></div>

                    <div class="ds-preview">
                        <div class="ds-previewframe">${sanitize(it.html)}</div>
                    </div>

                    <div class="ds-codewrap">
                        <div class="ds-actions">
                        <details class="ds-details">
                            <summary class="ds-summary">Ver código</summary>
                            <pre class="ds-pre"><code>${escapeHtml(it.html)}</code></pre>
                        </details>

                        <button class="ds-btn ds-copy" type="button">Copiar</button>
                        </div>
                    </div>
                    `;

                card.querySelector(".ds-copy").onclick = () => {
                    navigator.clipboard.writeText(it.html);
                    toast("Copiado");
                };

                grid.appendChild(card);
            });
        }

        // ====== EVENTOS FILTROS + INIT ======

        $("reloadBtn").onclick = async () => {
            $("searchInput").value = "";
            $("categoryFilter").value = "";
            $("statusFilter").value = "active";
            await refreshCategories();
            await loadComponents();
        };

        $("statusFilter").onchange = async () => {
            await refreshCategories();
            await loadComponents();
        };

        $("categoryFilter").onchange = () => loadComponents();

        // Debounce real (si no, se acumulan requests al tipear/borrar)
        $("searchInput").oninput = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                loadComponents();
            }, 250);
        };

        // INIT: cargar categorías (para que el select siempre tenga todas)
        // y luego cargar los componentes
        (async () => {
            await refreshCategories();
            await loadComponents();
        })();


    </script>
</body>

</html>
